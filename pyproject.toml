[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-editor-cleanup"
version = "0.1.0"
description = "Commercial-safe core for AI-assisted video cleanup"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "numpy>=1.26,<3"]
ocr = ["rapidocr>=3.9.2,<4"]
benchmark = ["numpy>=1.26,<3"]
plates = ["numpy>=1.26,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
