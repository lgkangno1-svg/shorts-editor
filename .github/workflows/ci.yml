name: cleanup-core-ci

on:
  push:
    branches: ["feature/vmake-parity-core", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - name: Build distributable package
        run: |
          python -m pip install 'build>=1,<2'
          python -m build
      - name: Smoke-test built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import shorts_editor; print(shorts_editor.__name__)"

  ocr-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[ocr]'
      - name: Execute RapidOCR through the public adapter
        run: |
          python - <<'PY'
          import numpy as np
          from shorts_editor.ocr_adapters import create_rapidocr_engine, run_rapidocr_frame

          engine = create_rapidocr_engine(language="korean")
          frame = np.zeros((96, 320, 3), dtype=np.uint8)
          result = run_rapidocr_frame(engine, frame, frame_index=0)
          assert result.detections == ()
          assert result.precise_masks == ()
          PY

  media-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m pip install -e .
      - name: Generate, probe, and decode HEVC
        run: |
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i 'testsrc2=size=360x640:rate=30' \
            -t 0.2 -c:v libx265 -preset ultrafast -pix_fmt yuv420p /tmp/shorts-hevc-smoke.mp4
          python - <<'PY'
          from shorts_editor.media import decode_frame_rgb, probe_media

          probe = probe_media("/tmp/shorts-hevc-smoke.mp4")
          assert probe.video_codec == "hevc"
          assert (probe.width, probe.height) == (360, 640)
          assert probe.portable_decode_recommended is True
          frame = decode_frame_rgb("/tmp/shorts-hevc-smoke.mp4", timestamp_seconds=0.1)
          assert len(frame.rgb24) == 360 * 640 * 3
          PY
